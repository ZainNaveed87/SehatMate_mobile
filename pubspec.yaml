name: sehatmate_ai
description: Complete native Flutter conversion of the supplied SehatMate AI React prototype.
publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  file_picker: ^12.0.0
  flutter_secure_storage: ^11.0.0
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.1.2
  flutter_tts: ^4.2.3
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/sehatmate_icon.png
    - assets/branding/sehatmate_wordmark.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/sehatmate_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/sehatmate_icon.png"
  adaptive_icon_foreground_inset: 4
  min_sdk_android: 21
  remove_alpha_ios: true
